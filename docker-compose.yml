services:
  postgres:
    image: postgres:16-alpine
    container_name: airport_postgres
    restart: unless-stopped
    env_file: .env
    ports:
      - "5432:5432"          # localhost:5432 → container
    volumes:
      - pg_data:/var/lib/postgresql/data          # persistent storage
      - ./sql:/docker-entrypoint-initdb.d          # SQL scripts run on first start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d airport_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
  